<!-- Sanitized shape of POST /usuario/Grid (SIGC usuário module). The row's
     action buttons all carry the user id as their value; Matrícula is the
     SIAPE. Column set with the action column present (viewer may edit). -->
<div class="table-responsive">
<table class="table table-striped" id="tableUsuarios">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Matrícula</th>
      <th>UF</th>
      <th>Função</th>
      <th>Posto</th>
      <th>Status</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td>ALEXANDRE SILVA DE SANTANA</td>
      <td>1234567</td>
      <td>BA</td>
      <td>Agente de Pesquisas e Mapeamento</td>
      <td>29XJYY - SALVADOR</td>
      <td>Ativo</td>
      <td>
        <button type="button" class="btn btn-sm btn-primary btnEditar" value="98765" title="Editar">Editar</button>
        <button type="button" class="btn btn-sm btn-danger btnInativar" value="98765" title="Inativar">Inativar</button>
      </td>
    </tr>
  </tbody>
</table>
</div>
